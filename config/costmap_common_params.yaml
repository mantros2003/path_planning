# Distance from the robot to mark/clear obstacles in the costmap
obstacle_range: 2.5
raytrace_range: 3.0

# Shape of the robot. 
# Use 'footprint' for a polygon or 'robot_radius' for a circle.
robot_radius: 0.2 

# Layers to be used in the costmap
inflation_layer:
    inflation_radius: 0.55 # Distance from obstacles where cost is non-zero
    cost_scaling_factor: 10.0 # How fast the cost drops off from the obstacle

# Sensor source configuration
observation_sources: laser_scan_sensor
laser_scan_sensor: {sensor_frame: base_scan, data_type: LaserScan, topic: scan, marking: true, clearing: true}
